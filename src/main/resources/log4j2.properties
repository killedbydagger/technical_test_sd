status=WARN

# Console
appender.console.type=Console
appender.console.name=LogToConsole
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
appender.console.filter.threshold.type=ThresholdFilter
appender.console.filter.threshold.level=ERROR
appender.console.filter.threshold.onMatch=DENY
appender.console.filter.threshold.onMismatch=NEUTRAL

# Rotate log file
appender.rolling.type=RollingFile
appender.rolling.name=LogToRollingFile
appender.rolling.fileName=logs/app.log
appender.rolling.filePattern=logs/$${date:yyyy-MM}/app-%d{MM-dd-yyyy}-%i.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d %p %C{1.} [%t] %m%n
appender.rolling.filter.threshold.type=ThresholdFilter
appender.rolling.filter.threshold.level=WARN
appender.rolling.filter.threshold.onMatch=ACCEPT
appender.rolling.filter.threshold.onMismatch=DENY
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.max=10

# Log to console and rolling file
logger.app.name=tech.nimbus9.internal
logger.app.level=INFO
logger.app.additivity=false
logger.app.appenderRef.rolling.ref=LogToRollingFile
logger.app.appenderRef.console.ref=LogToConsole

rootLogger.level=INFO
rootLogger.appenderRef.rolling.ref=LogToRollingFile
rootLogger.appenderRef.console.ref=LogToConsole